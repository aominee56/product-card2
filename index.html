<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог товарів</title>
  <link rel="stylesheet" href="style-scss.css">
</head>
<body>

  <div class="catalog">
    <div class="card">
      <h3>Товар 1</h3>
      <p>Опис першого товару.</p>
      <div class="price">500 грн</div>
      <button class="btn">Купити</button>
    </div>

    <div class="card">
      <h3>Товар 2</h3>
      <p>Опис другого товару.</p>
      <div class="price">750 грн</div>
      <button class="btn">Купити</button>
    </div>

    <div class="card">
      <h3>Товар 3</h3>
      <p>Опис третього товару.</p>
      <div class="price">1200 грн</div>
      <button class="btn">Купити</button>
    </div>
  </div>

</body>
</html>
